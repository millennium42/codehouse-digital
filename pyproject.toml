[project]
name = "codehouse-prospecting-agent"
version = "0.1.0"
description = "Agente de prospecção comercial CodeHouse (Hermes orquestra, n8n ponte WhatsApp, PostgreSQL estado)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
