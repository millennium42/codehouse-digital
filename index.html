<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style>
    /* ==========================================================================
       TOKENS
       ========================================================================== */
    :root {
      --bg:             #F0F4F8;
      --surface:        #E2EBF4;
      --surface-raised: #FAFCFE;
      --cloud:          #3E82AB;
      --cloud-hover:    #2E6E95;
      --cloud-light:    #6AAFD6;
      --cloud-faint:    #C0D8EC;
      --ink:            #17232E;
      --ink-muted:      #4A6275;
      --ink-faint:      #7A9AAF;
      --border:         #B4CCE0;
      --border-strong:  #7AADC8;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono: 'Courier New', 'Courier', monospace;
    }

    @media (prefers-color-scheme: dark) { 
      :root {
        --bg:             #0C141D;
        --surface:        #13202E;
        --surface-raised: #192B3C;
        --cloud:          #5898C0;
        --cloud-hover:    #6AAFD6;
        --cloud-faint:    #1C3A52;
        --ink:            #D8E8F4;
        --ink-muted:      #7A9AB4;
        --ink-faint:      #4A6880;
        --border:         #1E3A52;
        --border-strong:  #2E567A;
      }
    }

    :root[data-theme="dark"] {
      --bg:             #0C141D;
      --surface:        #13202E;
      --surface-raised: #192B3C;
      --cloud:          #5898C0;
      --cloud-hover:    #6AAFD6;
      --cloud-faint:    #1C3A52;
      --ink:            #D8E8F4;
      --ink-muted:      #7A9AB4;
      --ink-faint:      #4A6880;
      --border:         #1E3A52;
      --border-strong:  #2E567A;
    }

    :root[data-theme="light"] {
      --bg:             #F0F4F8;
      --surface:        #E2EBF4;
      --surface-raised: #FAFCFE;
      --cloud:          #3E82AB;
      --cloud-hover:    #2E6E95;
      --cloud-light:    #6AAFD6;
      --cloud-faint:    #C0D8EC;
      --ink:            #17232E;
      --ink-muted:      #4A6275;
      --ink-faint:      #7A9AAF;
      --border:         #B4CCE0;
      --border-strong:  #7AADC8;
    }

    /* ==========================================================================
       RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       BASE
       ========================================================================== */
    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    /* ==========================================================================
       COMPONENTES REUTILIZAVEIS
       ========================================================================== */

    /* ==========================================================================
       LAYOUT
       ========================================================================== */

    /* ==========================================================================
       RESPONSIVIDADE
       ========================================================================== */
  </style>
</head>
<body>
</body>
</html>
